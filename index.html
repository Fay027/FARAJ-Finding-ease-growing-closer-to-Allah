    "Allāhumma aslamtu nafsī ilayk, wa fawwaḍtu amrī ilayk, wa wajjahtu wajhiya ilayk, wa alja'tu ẓahrī ilayk, raghbatan wa rahbatan ilayk, lā malja'a wa lā manjā minka illā ilayk, āmantu bi-kitābika-lladhī anzalt, wa bi-nabiyyika-lladhī arsalt.",
    'O Allah, I submit my soul to You, entrust my affair to You, turn my face toward You, and lean my back against You, out of hope and fear of You. There is no refuge and no escape from You except to You. I believe in Your Book which You have revealed, and in Your Prophet whom You have sent.',
    'Sahih al-Bukhari (247, 6313), Sahih Muslim (2710)',
    'The Prophet ﷺ explicitly advised Al-Baraa ibn Aazib (RA) to make this the very last thing spoken before sleep. If a person dies during that night, they die upon the pure natural disposition of faith (al-fitrah).'),
];
const AD_KEY = 'faraj_adhkar';
let adSection = 'morning';
const adState = { date: '', counts: {} };
const adDone = (c) => (adState.counts[c.id] || 0) >= c.count;
const adFind = (id) => Object.values(ADHKAR).flatMap((s) => s.cards).find((c) => c.id === id);

function loadAdhkar() {
  adState.date = todayKey();
  adState.counts = {};
  try {
    const s = JSON.parse(localStorage.getItem(AD_KEY));
    if (s && s.date === adState.date && s.counts) adState.counts = s.counts;
  } catch (e) {}
}
function saveAdhkar() { try { localStorage.setItem(AD_KEY, JSON.stringify(adState)); } catch (e) {} }
function checkAdhkarDay() { if (todayKey() !== adState.date) { loadAdhkar(); renderAdhkar(); } }

function adCard(c) {
  const n = adState.counts[c.id] || 0, fin = n >= c.count;
  const isAr = /[\u0600-\u06FF]/.test(c.arabic || '');
  return `<div class="card ad${fin ? ' fin' : ''}">
    ${c.sample ? '<div class="stag">SAMPLE CARD</div>' : ''}
    <h3>${esc(c.title)}</h3>
    ${c.parts ? `<div class="parts">${c.parts.map((p) => `<div class="part"><div class="plabel">${esc(p.label)}</div><div class="arabic">${esc(p.arabic)}</div><div class="translit">${esc(p.transliteration).replace(/'/g, '’')}</div><div class="tr">${esc(p.translation)}</div></div>`).join('')}</div>` : ''}
    ${c.arabic ? `<div class="${isAr ? 'arabic' : 'ph'}">${esc(c.arabic)}</div>` : ''}
    ${c.transliteration ? `<div class="translit">${esc(c.transliteration).replace(/'/g, '’')}</div>` : ''}
    ${c.translation ? `<div class="tr">${c.plain ? '' : '“'}${esc(c.translation)}${c.plain ? '' : '”'}</div>` : ''}
    ${c.source ? `<div class="src">${esc(c.source)}</div>` : ''}
    ${c.virtue ? `<hr><div class="label">VIRTUE</div><p class="body">${esc(c.virtue)}</p>` : ''}
    <div class="cnt"><button class="tap${fin ? ' on' : ''}" data-tap="${esc(c.id)}">${fin ? '✓ Done' : c.count > 1 ? `Tap to count · ${n} / ${c.count}` : 'Tap when done'}</button>${n > 0 ? `<button class="undo" data-undo="${esc(c.id)}" aria-label="Reset this dhikr">↺</button>` : ''}</div>
  </div>`;
}

function renderAdhkar() {
  const st = $('adhkar').scrollTop;
  const sec = ADHKAR[adSection];
  const done = sec.cards.filter(adDone).length, total = sec.cards.length;
  $('adhkar').innerHTML = `<div class="wrap">
    <div class="header"><h1 class="title">Adhkar</h1><p class="subtitle">${esc(sec.hint)}</p></div>
    <div class="seg">${Object.entries(ADHKAR).map(([k, v]) => `<button data-seg="${k}" class="${k === adSection ? 'on' : ''}">${esc(v.label)}</button>`).join('')}</div>
    <div class="bar"><div class="fill" style="width:${total ? (done / total) * 100 : 0}%"></div></div>
    <div class="prog adprog">${done} of ${total} done today</div>
    ${sec.cards.map(adCard).join('')}
  </div>`;
  $('adhkar').scrollTop = st;
}

// Finishing every real Morning or Evening card also ticks it in the Garden
function linkGarden() {
  [['morning', 'morningAdhkar'], ['evening', 'eveningAdhkar']].forEach(([k, g]) => {
    const cards = ADHKAR[k].cards;
    if (cards.length && !ADHKAR[k].partial && !cards.some((c) => c.sample) && cards.every(adDone) && !state.dhikr[g]) { state.dhikr[g] = true; updateGarden(); }
  });
}

$('adhkar').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.seg) { adSection = b.dataset.seg; renderAdhkar(); $('adhkar').scrollTop = 0; return; }
  if (b.dataset.tap) { const c = adFind(b.dataset.tap); if (c && !adDone(c)) adState.counts[c.id] = (adState.counts[c.id] || 0) + 1; }
  else if (b.dataset.undo) { delete adState.counts[b.dataset.undo]; }
  else return;
  saveAdhkar(); linkGarden(); renderAdhkar();
});
loadAdhkar();
renderAdhkar();

/* ---------- Offline support ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
