<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Faraj">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Faraj</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#F7F4EF;--green:#B5C4A9;--green-b:#A4B498;--ink:#2C3531;--muted:#7A8C6F;--pink:#F3D1D0;--pink-b:#E8B6B5;--accent:#D48B99;--soft:#7A6168;--serif:Georgia,'Times New Roman',serif;--shadow:0 2px 8px rgba(0,0,0,.05)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#screens{height:100%}
.screen{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(32px + env(safe-area-inset-top,0px)) 24px calc(120px + env(safe-area-inset-bottom,0px));}
.screen.active{display:block}
.wrap{max-width:560px;margin:0 auto}
#home.active{display:flex;flex-direction:column;justify-content:center}
#home .wrap{width:100%;margin:auto}
.brand{text-align:center;font-family:var(--serif);font-size:12px;letter-spacing:.5px;color:var(--muted);opacity:.85;margin-top:24px;padding-top:8px}

/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #F0DFE3;box-shadow:0 -2px 10px rgba(0,0,0,.05);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--soft);min-height:48px}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}
.tab.active svg{fill:currentColor;fill-opacity:.25}

/* shared */
.title{font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:.5px;text-align:center}
.subtitle{font-size:14px;line-height:22px;color:var(--muted);margin-top:4px;text-align:center}
.header{text-align:center;margin-bottom:32px;padding:0 8px}
.card{background:var(--green);border:1px solid var(--green-b);border-radius:24px;box-shadow:var(--shadow)}

/* home */
.greet{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.welcome{text-align:center;margin-bottom:32px;padding:0 8px}
.welcome h1{font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:.5px;margin-bottom:4px}
.welcome .sub{font-size:14px;font-style:italic;color:var(--muted);margin-bottom:16px}
.welcome p.txt{font-size:15px;line-height:24px;opacity:.9}
.daily{padding:24px;text-align:center}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--pink);padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:1.5px;margin-bottom:8px}
.arabic{direction:rtl;text-align:center;line-height:1.9}
.daily .arabic{font-size:24px;margin:4px 0}
.daily .tr{font-size:14px;font-style:italic;margin-bottom:4px;opacity:.95}
.daily .src{font-size:12px;opacity:.8}

/* feel */
.chips{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding-bottom:32px}
.chip{padding:16px 24px;border-radius:999px;border:1px solid rgba(255,255,255,.6);box-shadow:var(--shadow);font-size:15px;animation:float 1.8s ease-in-out infinite alternate;transition:transform .15s}
.chip:active{transform:scale(.94);animation-play-state:paused}
@keyframes float{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.back{display:flex;align-items:center;gap:4px;margin-bottom:24px;font-size:15px;color:var(--muted);min-height:44px}
.back svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.emo-badge{display:block;text-align:center;font-size:14px;font-weight:600;letter-spacing:2px;margin-bottom:16px}
.verse{border-radius:24px;padding:32px 24px;text-align:center;border:1px solid rgba(255,255,255,.6);box-shadow:var(--shadow)}
.label{font-size:11px;font-weight:700;letter-spacing:1.5px;margin-bottom:4px}
.verse .arabic{font-size:26px;line-height:1.8;margin-bottom:4px}
.translit{font-size:13px;font-style:italic;margin-bottom:16px;opacity:.85}
.verse .tr{font-size:15px;font-style:italic;line-height:24px;margin-bottom:4px}
.verse .src{font-size:12px;margin-top:4px;opacity:.8}
.body{font-size:14px;line-height:22px}
hr{border:0;height:1px;background:rgba(0,0,0,.1);margin:24px 0}

/* garden */
.trees{display:flex;align-items:center;padding:24px;margin-bottom:24px}
.trees .ico{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.trees img{width:42px;height:42px;object-fit:contain}
.trees .t{margin-left:16px}
.trees .n{font-family:var(--serif);font-size:20px;font-weight:600}
.trees .l{font-size:12px;opacity:.8;margin-top:2px}
.cult{margin-bottom:32px;padding:0 8px;text-align:center}
.cult h3{font-family:var(--serif);font-size:15px;font-weight:600;display:flex;gap:4px;justify-content:center;align-items:center;margin-bottom:4px}
.cult h3 svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cult p{font-size:13px;line-height:20px;color:var(--muted);font-style:italic}
.plant{padding:32px 24px;text-align:center;margin-bottom:32px}
.stage{display:inline-block;background:var(--pink);padding:4px 16px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:1.5px;margin-bottom:16px}
.plant img{width:100%;height:160px;object-fit:contain;margin:8px 0}
.plant .st{font-size:15px;font-style:italic;margin-bottom:24px}
.bar{height:8px;background:rgba(255,255,255,.5);border-radius:999px;overflow:hidden;margin-bottom:4px}
.fill{height:100%;width:0;background:var(--ink);border-radius:999px;transition:width .4s ease}
.prog{font-size:12px;font-weight:500;opacity:.85}
.section{margin-bottom:32px}
.section h2{font-family:var(--serif);font-size:22px;font-weight:400;text-align:center}
.section .s{font-size:13px;color:var(--muted);margin-bottom:16px;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-radius:20px;margin-bottom:16px;background:var(--green);border:1px solid var(--green-b);box-shadow:var(--shadow)}
.row .nm{font-size:16px;font-weight:600}
.group{display:flex;gap:4px}
.pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.5);padding:8px 10px;border-radius:999px;border:1px solid transparent;font-size:12px;font-weight:500;min-height:36px}
.pill.on,.dh.on{background:var(--pink);border-color:var(--pink-b)}
.pill.on{font-weight:600}
.ck{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.8;flex:none}
.dh{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:16px;border-radius:20px;margin-bottom:16px;background:var(--green);border:1px solid var(--green-b);box-shadow:var(--shadow)}
.dh .tx{flex:1;padding-right:8px}
.dh b{display:block;font-size:15px;font-weight:600}
.dh small{display:block;font-size:12px;margin-top:2px;opacity:.8}
.dh .ck{width:24px;height:24px}

/* adhkar */
.seg{display:flex;gap:4px;background:rgba(181,196,169,.35);padding:4px;border-radius:999px;margin-bottom:24px}
.seg button{flex:1;padding:10px 4px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);min-height:40px}
.seg button.on{background:var(--green);color:var(--ink);box-shadow:var(--shadow)}
.adprog{text-align:center;margin-top:4px;margin-bottom:24px}
.ad{padding:24px;margin-bottom:16px;text-align:center}
.ad.fin{opacity:.8}
.ad h3{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:12px}
.ad .arabic{font-size:24px;margin-bottom:8px}
.ad .arabic,.ad .translit,.ad .tr{white-space:pre-line}
.ad .ph{font-size:14px;opacity:.7;margin-bottom:8px}
.ad .translit{font-size:13px;font-style:italic;margin-bottom:12px;opacity:.85}
.ad .tr{font-size:15px;line-height:24px;margin-bottom:4px}
.ad .src{font-size:12px;opacity:.8}
.part{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid rgba(0,0,0,.1)}
.part:last-child{border:0;padding-bottom:0;margin-bottom:8px}
.plabel{font-size:11px;font-weight:700;letter-spacing:1.5px;margin-bottom:10px;opacity:.85}
.stag{display:inline-block;background:var(--pink);padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:1.5px;margin-bottom:12px}
.cnt{display:flex;gap:8px;margin-top:20px}
.tap{flex:1;min-height:52px;border-radius:999px;background:var(--pink);border:1px solid var(--pink-b);font-size:15px;font-weight:600}
.tap:active{transform:scale(.98)}
.tap.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.undo{width:52px;min-height:52px;border-radius:999px;background:rgba(255,255,255,.5);font-size:20px}

/* the heart: topics */
.topics{margin-top:8px;padding-bottom:16px}
.tt{font-family:var(--serif);font-size:22px;font-weight:400;text-align:center}
.topics .subtitle{margin-bottom:8px}
.topic{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:16px 20px;border-radius:20px;margin-top:12px;background:var(--green);border:1px solid var(--green-b);box-shadow:var(--shadow)}
.topic b{display:block;font-size:16px;font-weight:600}
.topic small{display:block;font-size:12px;margin-top:2px;opacity:.8}
.chev{font-size:24px;opacity:.6}
.tdua h4{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:12px}
.tdua + hr{margin:24px 0}
.tnote{margin:8px 0}
.xtra{margin-top:16px}
@media(prefers-reduced-motion:reduce){.chip{animation:none}}
</style>
</head>
<body>
<main id="screens">
  <section id="home" class="screen active"></section>
  <section id="feel" class="screen"></section>
  <section id="adhkar" class="screen"></section>
  <section id="garden" class="screen"></section>
</main>
<nav id="tabbar">
  <button class="tab active" data-screen="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg><span>Home</span></button>
  <button class="tab" data-screen="feel"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.7-8 11-8 11z"/></svg><span>The Heart</span></button>
  <button class="tab" data-screen="garden"><svg viewBox="0 0 24 24"><path d="M12 22V11M12 11c0-4 2-7 6-8 0 4-2 7-6 8zM12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg><span>Garden</span></button>
  <button class="tab" data-screen="adhkar"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h5v16H6a2 2 0 00-2 2V5zM20 5a2 2 0 00-2-2h-5v16h5a2 2 0 012 2V5z"/></svg><span>Adhkar</span></button>
</nav>
<script>
const VERSES = [
  {
    "id": "1",
    "emotion": "Sad",

    "textColor": "#3B3347",

    "transliteration": "La tahzan innallaha ma'ana",
    "translation": "And do not grieve; indeed Allah is with us.",
    "source": "Surah At-Tawbah 9:40",
    "hadith": "No fatigue, nor disease, nor sorrow, nor sadness, nor hurt, nor distress befalls a Muslim... but that Allah expiates some of his sins for it. (Sahih al-Bukhari)",
    "dua": "Ya Allah, You know the heavy weight in my chest that words cannot explain. Please comfort my heart, wipe away my sorrow, and remind me that Your relief is always close.",

  {

    "textColor": "#2B3A42",

    "transliteration": "Alladhina idha asabat-hum museebatun qaloo inna lillahi wa inna ilayhi raji'oon",
    "translation": "Who, when disaster strikes them, say, 'Indeed we belong to Allah, and indeed to Him we will return.'",

    "hadith": "The eyes shed tears and the heart grieves, but we will not say except what pleases our Lord. (Sahih al-Bukhari)",
    "dua": "Ya Allah, my heart is broken and missing what was lost. Wrap my aching soul in Your comfort and grant me the strength to carry this grief with patience.",
    "reflection": "Crying and grieving are not signs of weak faith—even the Prophets wept. Your tears are seen and honored."
  },
  {
    "id": "3",
    "emotion": "Despondent",
    "color": "#ECE4E2",
    "textColor": "#42322E",
    "arabic": "وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ",

    "translation": "And do not despair of the mercy of Allah...",
    "source": "Surah Yusuf 12:87",
    "hadith": "Allah says: 'I am as My servant thinks of Me, and I am with him when he remembers Me...' (Sahih al-Bukhari)",
    "dua": "Ya Allah, I feel helpless right now, but Your mercy is greater than any hardship I face. Open a door of hope for me where I see no way forward.",

  },
  {
    "id": "4",

    "color": "#ECEBE4",
    "textColor": "#38372E",
    "arabic": "لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا",
    "transliteration": "La yukallifullahu nafsan illa wus'aha",
    "translation": "Allah does not charge a soul except with that within its capacity.",
    "source": "Surah Al-Baqarah 2:286",
    "hadith": "Your body has a right over you... (Sahih al-Bukhari)",
    "dua": "Ya Allah, my energy is spent. Grant my body true rest, renew my strength, and accept even my smallest efforts today.",
    "reflection": "Rest is an act of worship. Pacing yourself and recharging is part of caring for the vessel Allah gave you."
  },
  {
    "id": "5",
    "emotion": "Disgust",
    "color": "#E6E8E3",
    "textColor": "#31382E",

    "translation": "And do not spy or backbite each other...",
    "source": "Surah Al-Hujurat 49:12",
    "hadith": "Whoever among you sees an evil, let him change it with his hand; if he cannot, then with his tongue; and if he cannot, then with his heart... (Sahih Muslim)",
    "dua": "Ya Allah, protect my eyes, mind, and heart from harmful things. Keep my soul clean and help me stand firmly on what is right.",
    "reflection": "Natural aversion to wrongdoing or harm protects your spiritual alignment. Channel it into quiet boundaries and clean actions."
  },
  {
    "id": "6",
    "emotion": "Anxious",
    "color": "#E2ECE9",
    "textColor": "#2C403B",
    "arabic": "أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",
    "transliteration": "Ala bidhikrillahi tatma'innul-quloob",
    "translation": "Unquestionably, by the remembrance of Allah do hearts find rest.",
    "source": "Surah Ar-Ra'd 13:28",
    "hadith": "O Allah, I seek refuge in You from anxiety and sorrow... (Sahih al-Bukhari)",
    "dua": "Ya Allah, my mind is racing. I place all my worries into Your hands. Bring peace to my thoughts and calm my fears.",
    "reflection": "Anxiety comes from carrying tomorrow's weight today. Dhikr grounds your heart back in the present."
  },
  {
    "id": "7",
    "emotion": "Worried",
    "color": "#E3ECED",
    "textColor": "#2A3D40",
    "arabic": "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
    "transliteration": "Hasbunallahu wa ni'mal-wakeel",
    "translation": "Sufficient for us is Allah, and [He is] the best Disposer of affairs.",

  {
    "id": "8",
    "emotion": "Fear",
    "color": "#ECE2E8",
    "textColor": "#422A3A",

  },
  {

    "translation": "...and who restrain anger and who pardon the people - and Allah loves the doers of good.",
    "source": "Surah Ali 'Imran 3:134",
    "hadith": "The strong person is not the one who can wrestle someone down. The strong person is the one who controls himself when he is angry. (Sahih al-Bukhari)",
    "dua": "Ya Allah, help me cool my temper. Grant me patience, protect my words from causing harm, and replace this rage with Your tranquility.",
    "reflection": "True strength is pausing before reacting. Shifting your position and taking a breath lets patience regain control."
  },
  {
    "id": "10",
    "emotion": "Happy",
    "color": "#FBF0D9",
    "textColor": "#4A3E25",
    "arabic": "قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا",
    "transliteration": "Qul bifadillahi wa birahmatihi fabidhalika falyafrahoo",
    "translation": "Say, 'In the bounty of Allah and in His mercy - in that let them rejoice...'",
    "source": "Surah Yunus 10:58",
    "hadith": "If something good happens to him, he gives thanks (Shukr), and that is good for him... (Sahih Muslim)",
    "dua": "Ya Allah, thank You for this moment of light and joy. Bless this happiness and keep my heart humble, grateful, and close to You.",

  },
  {
    "id": "11",

    "translation": "So race to all that is good.",
    "source": "Surah Al-Baqarah 2:148",

    "dua": "Ya Allah, my heart is full of energy! Guide this joy toward things that please You, keep my intentions pure, and let this lead to good.",

  },
  {
    "id": "12",
    "emotion": "Surprised",
    "color": "#F5EFE6",
    "textColor": "#3D372E",
    "arabic": "أَتَعْجَبِينَ مِنْ أَمْرِ اللَّهِ ۖ رَحْمَتُ اللَّهِ وَبَرَكَاتُهُ عَلَيْكُمْ",
    "transliteration": "A'ta'jabina min amrillahi rahmatullahi wa barakatuhu 'alaykum",
    "translation": "They said, 'Are you amazed at the decree of Allah? May the mercy of Allah and His blessings be upon you...'",

<script>

/* One ayah per day: the day of the month (1-31) picks the ayah.

   Duplicates (same source) are dropped automatically, first one wins. */
const DAILY_AYAHS = [
  {"source": "Surah Al-Baqarah 2:152", "arabic": "فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ", "translation": "So remember Me; I will remember you. And be grateful to Me and do not deny Me."},
  {"source": "Surah Al-Baqarah 2:186", "arabic": "وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ", "translation": "And when My servants ask you concerning Me, indeed I am near. I respond to the invocation of the supplicant when he calls upon Me."},
  {"source": "Surah Ali 'Imran 3:139", "arabic": "وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ", "translation": "So do not weaken and do not grieve, and you will be superior if you are true believers."},
  {"source": "Surah Ali 'Imran 3:160", "arabic": "إِن يَنصُرْكُمُ اللَّهُ فَلَا غَالِبَ لَكُمْ ۖ وَإِن يَخْذُلْكُمْ فَمَن ذَا الَّذِي يَنصُرُكُم مِّن بَعْدِهِ ۗ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ", "translation": "If Allah helps you, none can overcome you; and if He forsakes you, who is there that can help you after Him? And upon Allah let the believers rely."},
  {"source": "Surah Ar-Ra'd 13:28", "arabic": "الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ", "translation": "Those who have believed and whose hearts find rest in the remembrance of Allah. Unquestionably, by the remembrance of Allah do hearts find rest."},
  {"source": "Surah Ibrahim 14:7", "arabic": "وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِن كَفَرْتُمْ إِنَّ عَذَابِي لَشَدِيدٌ", "translation": "And remember when your Lord proclaimed, \"If you are grateful, I will surely increase you; but if you deny, indeed, My punishment is severe.\""},
  {"source": "Surah An-Nahl 16:97", "arabic": "مَنْ عَمِلَ صَالِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً ۖ وَلَنَجْزِيَنَّهُمْ أَجْرَهُم بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ", "translation": "Whoever does righteousness, whether male or female, while he is a believer - We will surely cause him to live a good life, and We will surely give them their reward according to the best of what they used to do."},
  {"source": "Surah Al-Anbiya 21:87", "arabic": "وَذَا النُّونِ إِذ ذَّهَبَ مُغَاضِبًا فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظَّلُمَاتِ أَن لَّا إِلَهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ", "translation": "And [mention] the Man of the Whale, when he went off in anger and thought that We would not decree [anything] upon him. And he called out within the darknesses, \"There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.\""},
  {"source": "Surah Al-Furqan 25:58", "arabic": "وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ وَسَبِّحْ بِحَمْدِهِ", "translation": "And rely upon the Ever-Living who does not die, and exalt [Allah] with His praise."},
  {"source": "Surah Al-Ankabut 29:69", "arabic": "وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ۚ وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ", "translation": "And those who strive for Us - We will surely guide them to Our ways. And indeed, Allah is with the doers of good."},
  {"source": "Surah Luqman 31:22", "arabic": "وَمَن يُسْلِمْ وَجْهَهُ إِلَى اللَّهِ وَهُوَ مُحْسِنٌ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ ۗ وَإِلَى اللَّهِ عَاقِبَةُ الْأُمُورِ", "translation": "And whoever submits his face to Allah while he is a doer of good - then he has grasped the most trustworthy handhold. And to Allah will be the outcome of all matters."},
  {"source": "Surah Az-Zumar 39:53", "arabic": "قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا ۚ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ", "translation": "Say, \"O My servants who have transgressed against themselves, do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful.\""},
  {"source": "Surah Ghafir 40:60", "arabic": "وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ", "translation": "And your Lord says, \"Call upon Me; I will respond to you.\""},
  {"source": "Surah Ash-Shura 42:26", "arabic": "وَيَسْتَجِيبُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَيَزِيدُهُم مِّن فَضْلِهِ", "translation": "And He answers those who have believed and done righteous deeds and increases them from His bounty."},
  {"source": "Surah At-Talaq 65:2-3", "arabic": "وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ", "translation": "And whoever fears Allah - He will make for him a way out and will provide for him from where he does not expect. And whoever relies upon Allah - then He is sufficient for him."},
  {"source": "Surah Ash-Sharh 94:5-6", "arabic": "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا إِنَّ مَعَ الْعُسْرِ يُسْرًا", "translation": "For indeed, with hardship comes ease. Indeed, with hardship comes ease."},
  ...VERSES.map((v) => ({ arabic: v.arabic, translation: v.translation, source: v.source })),
].filter((a, i, arr) => arr.findIndex((b) => b.source === a.source) === i);

const ayahForDay = (date = new Date()) => DAILY_AYAHS[(date.getDate() - 1) % DAILY_AYAHS.length];
let shownDay = null;
function renderDaily() {
  const now = new Date();
  const key = now.toDateString();
  if (key === shownDay) return;
  shownDay = key;
  const a = ayahForDay(now);
  $('dailyAr').textContent = a.arabic;
  $('dailyTr').textContent = `“${a.translation.replace(/"([^"]*)"/g, '‘$1’')}”`;
  $('dailySrc').textContent = a.source.replace(/'/g, '’');
}
renderDaily();
// If the app stays open past midnight, refresh the ayah when the user comes back to it
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderDaily(); });

/* ---------- How I Feel ---------- */
const ayah3953 = DAILY_AYAHS.find((a) => a.source === 'Surah Az-Zumar 39:53');
VERSES.push({ emotion: 'Guilt', color: '#E8E4F0', textColor: '#3D2C31', arabic: ayah3953.arabic, translation: ayah3953.translation, source: ayah3953.source,
  hadith: 'Every son of Adam sins, and the best of those who sin are those who repent. (Jami’ at-Tirmidhi 2499)',
  dua: 'O Allah, I turn back to You. Forgive me, accept my return, and do not let me despair of Your mercy.',
  reflection: 'Guilt shows that your heart is alive and still cares. Let it lead you back to Allah, not away from Him. His mercy is greater than any mistake.' });
const emotions = [...new Set(VERSES.map((v) => v.emotion))].map((name) => {
  const m = VERSES.find((v) => v.emotion === name);
  return { name, color: m.color || '#E4EFF2', textColor: m.textColor || '#3D2C31' };
});

/* Topics: a struggle, with encouragement, dua(s), intention, turning to Allah, and the practical means.

const TOPICS = [
  { id: 'debt', title: 'Debt', blurb: 'When what you owe weighs on your heart',
    encouragement: 'Debt can weigh heavily on the heart, and you are not alone in carrying it. The Prophet ﷺ taught that whoever takes people’s wealth intending to repay it, Allah will fulfil it on his behalf (Sahih al-Bukhari 2387). And whoever has taqwa, Allah makes a way out for him.',
    ayah: { arabic: 'وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مَخْرَجًۭا (٢) وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى ٱللَّهِ فَهُوَ حَسْبُهُۥ ۚ إِنَّ ٱللَّهَ بَـٰلِغُ أَمْرِهِۦ ۚ قَدْ جَعَلَ ٱللَّهُ لِكُلِّ شَىْءٍۢ قَدْرًۭا (٣)',
      translation: '...And whoever fears Allah—He will make for him a way out. And will provide for him from where he does not expect. And whoever relies upon Allah—then He is sufficient for him. Indeed, Allah will accomplish His purpose. Allah has already set for everything a [decreed] extent.', source: 'Surah At-Talaq 65:2-3' },
    duas: [ { ref: 'b-debt' },
      { title: 'Dua for Halal Provision and Independence from Others', arabic: 'اللَّهُمَّ اكْفِنِي بِحَلاَلِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ',
        transliteration: "Allāhumma-kfinī bi-ḥalālika 'an ḥarāmik, wa aghninī bi-faḍlika 'amman siwāk.",
        translation: 'O Allah! Grant me enough of what You make lawful so that I may dispense with what You make unlawful, and enable me by Your Grace to dispense with all but You.',
        source: "Jami' at-Tirmidhi (3563); graded Hasan" } ],
    intention: 'I sincerely intend to repay what I owe, and I seek only what is halal.',
    turn: 'Make istighfar, keep taqwa, and make the dua consistently.',
    camel: 'Write down what you owe, talk to those you owe early, and ask a trustworthy adviser for guidance.' },
  { id: 'marriage', title: 'Marriage', blurb: 'When you are waiting, and others seem to move ahead',
    encouragement: 'Waiting can feel lonely, especially when the people around you seem to move ahead. Your timing is known to Allah. Prophet Musa (AS) had left everything behind, with no home, no money and no family, and he turned to Allah and said that he was in need of whatever good Allah would send down to him (28:24). After this dua, Allah opened doors for him: safety, work, and a family.',
    duas: [ { title: 'The Dua of Prophet Musa (AS) in Need', arabic: 'رَبِّ إِنِّى لِمَآ أَنزَلْتَ إِلَىَّ مِنْ خَيْرٍۢ فَقِيرٌۭ', transliteration: 'Rabbi innī limā anzalta ilayya min khayrin faqīr.', translation: 'My Lord, indeed I am for any good that You bestow upon me very needy.', source: 'Surah Al-Qasas 28:24' },
      { title: 'The Dua for Spouses and Family', arabic: 'رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا', transliteration: 'Rabbanā hab lanā min azwājinā wa dhurriyyātinā qurrata a‘yunin waj‘alnā lil-muttaqīna imāmā.', translation: 'Our Lord! Grant unto us spouses and offspring who will be the comfort of our eyes, and give us (the grace) to lead the righteous.', source: 'Surah Al-Furqan 25:74' } ],
    intention: 'I ask Allah for a righteous spouse, for companionship in worship and in life, and I trust His timing.',
    turn: 'Keep asking, especially in sujood and in the quiet of the night. Ask Allah to make you content while you wait, and to guard your heart from comparing yourself with others.',

  { id: 'child-want', title: 'Longing for a Child', blurb: 'When you are longing for a child',
    encouragement: 'The ache of waiting for a child is real. Prophet Zakariyya (AS) was very old and his wife was barren, yet he called on his Lord quietly and never stopped asking, and Allah gave him Yahya (19:2-7, 21:89-90). Whatever Allah decrees, your worth is not measured by whether you have children.',
    duas: [ { title: 'The Dua of Prophet Zakariyya (AS)', arabic: 'رَبِّ لَا تَذَرْنِى فَرْدًۭا وَأَنتَ خَيْرُ ٱلْوَٰرِثِينَ', transliteration: 'Rabbi lā tadharnī fardan wa Anta khayru-l-wārithīn.', translation: 'My Lord! Do not leave me childless, though You are the Best of Successors.', source: 'Surah Al-Anbiya 21:89' } ],
    intention: 'I ask Allah for righteous offspring, and I accept whatever He decrees.',
    turn: 'Keep making dua, and keep making istighfar. The Qur’an links istighfar with provision and children (71:10-12).',
    camel: 'See a doctor, together with your spouse if you are married, and follow medical advice.' },
  { id: 'child-sick', title: 'A Sick Child', blurb: 'When your child is sick',

    duas: [ { title: 'The Prophetic Healing Dua', arabic: 'أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ، وَاشْفِ أَنْتَ الشَّافِي، لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ، شِفَاءً لاَ يُغَادِرُ سَقَمًا', transliteration: 'Adhhibi-l-ba’sa Rabba-n-nās, washfi Anta-sh-Shāfī, lā shifā’a illā shifā’uk, shifā’an lā yughādiru saqamā.', translation: 'Remove the harm, O Lord of mankind, and heal, for You are the Healer. There is no healing but Your healing, a healing which leaves no disease behind.', source: 'Sahih al-Bukhari (5675)' } ],
    intention: 'I entrust my child to Allah, the Healer, and I do everything within my means.',
    turn: 'Recite the dua over your child, pray, and ask Allah for the strength to be patient and gentle.',

  { id: 'child-guide', title: 'A Child Who Is Hard to Guide', blurb: 'When your child is hard to guide',
    encouragement: 'When you are exhausted and angry, the way of the prophets was to pray for their children’s guidance. Prophet Ibrahim (AS) asked Allah to make him and his descendants keep up the prayer, and to accept his dua (14:40).',
    duas: [ { title: 'The Dua of Prophet Ibrahim (AS)', arabic: 'رَبِّ ٱجْعَلْنِى مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِى ۚ رَبَّنَا وَتَقَبَّلْ دُعَآءِ', transliteration: 'Rabbi-j‘alnī muqīma-ṣ-ṣalāti wa min dhurriyyatī, Rabbanā wa taqabbal du‘ā’.', translation: 'My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication.', source: 'Surah Ibrahim 14:40' },
      { title: 'Dua for Righteous Offspring', arabic: 'وَوَصَّيْنَا ٱلْإِنسَـٰنَ بِوَٰلِدَيْهِ إِحْسَـٰنًا ۖ حَمَلَتْهُ أُمُّهُۥ كُرْهًۭا وَوَضَعَتْهُ كُرْهًۭا ۖ وَحَمْلُهُۥ وَفِصَـٰلُهُۥ ثَلَـٰثُونَ شَهْرًا ۚ حَتَّىٰٓ إِذَا بَلَغَ أَشُدَّهُۥ وَبَلَغَ أَرْبَعِينَ سَنَةًۭ قَالَ رَبِّ أَوْزِعْنِىٓ أَنْ أَشْكُرَ نِعْمَتَكَ ٱلَّتِىٓ أَنْعَمْتَ عَلَىَّ وَعَلَىٰ وَٰلِدَىَّ وَأَنْ أَعْمَلَ صَـٰلِحًۭا تَرْضَىٰهُ وَأَصْلِحْ لِى فِى ذُرِّيَّتِىٓ ۖ إِنِّى تُبْتُ إِلَيْكَ وَإِنِّى مِنَ ٱلْمُسْلِمِينَ',
        translation: 'And We have enjoined upon man, to his parents, good treatment. His mother carried him with hardship and gave birth to him with hardship, and his bearing and weaning is thirty months. [He grows] until, when he reaches maturity and reaches [the age of] forty years, he says, ‘My Lord, enable me to be grateful for Your favour which You have bestowed upon me and upon my parents and to work righteousness of which You will approve and make righteous for me my offspring. Indeed, I have turned to You in repentance, and indeed, I am of the Muslims.’', source: 'Surah Al-Ahqaf 46:15' } ],
    intention: 'I want my child’s guidance more than I want to win the argument, and I will be firm and gentle.',
    turn: 'Calm yourself first with wudu and istighfar. Pray for your child by name, regularly, especially in sujood.',
    camel: 'Listen to understand, set clear and fair boundaries, and ask a trusted elder or counsellor for support. If anyone’s safety is at risk, seek professional help.' },
  { id: 'illness', title: 'Chronic Illness', blurb: 'When your body is tired and you feel like a burden',
    encouragement: 'When the body fails, the heart can feel that it has become a burden. Prophet Ayyub (AS) was struck by harm, and he called out to his Lord (21:83). He did not demand a cure. He stated his condition and relied on Allah’s mercy. Allah answered him and gave him his family and more (21:84), and described him as an excellent and patient servant (38:44). The Prophet ﷺ also taught that no tiredness, illness, worry, sadness or harm touches a Muslim without Allah expiating some of his sins because of it (Sahih al-Bukhari 5641).',
    duas: [ { title: 'The Dua of Prophet Ayyub (AS)', arabic: 'أَنِّى مَسَّنِىَ ٱلضُّرُّ وَأَنتَ أَرْحَمُ ٱلرَّٰحِمِينَ', transliteration: 'Annī massaniya-ḍ-ḍurru wa Anta arḥamu-r-rāḥimīn.', translation: 'Indeed, distress has touched me, and You are the Most Merciful of the merciful.', source: 'Surah Al-Anbiya 21:83' } ],
    intention: 'I accept this trial with patience, and I ask Allah for healing and wellbeing.',
    turn: 'Pray as you are able, even sitting or lying down. Keep dhikr on your tongue, and ask Allah for ‘afiyah.',
    camel: 'Follow medical advice, tell your family and your doctor honestly about your pain and your needs, and accept practical help, including community or support groups.' },
  { id: 'slander', title: 'Slander & Betrayal', blurb: 'When people spread lies about you',
    encouragement: 'Aisha (RA) was left behind by the caravan on a journey and brought back to Madinah by a companion. The leader of the hypocrites and others then spread a cruel rumour about her. She fell ill after returning and did not know at first. When she learned of it, she wept until she felt the weeping would split her liver, knowing she was innocent but unable to prove it. She said she could only say what the father of Yusuf said: “Fa sabrun jameel” (12:18). Allah then revealed verses clearing her name (24:11-20). (Sahih al-Bukhari 4750)',
    duas: [ { title: 'The Words of Prophet Ya‘qub (AS)', arabic: 'فَصَبْرٌ جَمِيلٌ ۖ وَٱللَّهُ ٱلْمُسْتَعَانُ عَلَىٰ مَا تَصِفُونَ', transliteration: 'Fa ṣabrun jamīl, wa-llāhu-l-musta‘ānu ‘alā mā taṣifūn.', translation: 'So beautiful patience is most fitting. And Allah is the one sought for help against that which you describe.', source: 'Surah Yusuf 12:18' } ],
    intention: 'I leave my defence to Allah, I will not answer lies with lies, and I will keep my character clean.',
    turn: 'Say “Fa sabrun jameel” and “Hasbunallahu wa ni‘mal wakeel”, pray, and remember that Allah knows the truth even when people do not.',
    camel: 'Talk calmly with someone you trust. If the slander is written, keep records (messages, screenshots), report it to the platform or the proper authority if needed, and ask a trusted elder to speak the truth where you can’t.' },
  { id: 'intimidation', title: 'Intimidation & Pressure', blurb: 'When you feel small and under pressure',
    encouragement: 'After the hardship of Uhud, the companions were wounded and tired when they were warned that people had gathered against them. It only increased their faith, and they said, “Sufficient for us is Allah, and He is the best disposer of affairs” (3:173; Sahih al-Bukhari 4563).',
    duas: [ { title: 'The Words of the Companions at Hamra al-Asad', arabic: 'حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ', transliteration: 'Ḥasbunā-llāhu wa ni‘ma-l-wakīl.', translation: 'Sufficient for us is Allah, and [He is] the best Disposer of affairs.', source: 'Surah Ali ‘Imran 3:173; Sahih al-Bukhari (4563)' } ],
    intention: 'I rely on Allah and do what is within my power, and I will not let fear make my decisions.',
    turn: 'Say “Hasbunallahu wa ni‘mal wakeel”, pray, and ask Allah for steadiness and clear thinking.',
    camel: 'Write down what is happening (dates, what was said), speak to someone you trust, and use the proper channels (HR, a union, a lawyer or the authorities). If you are in danger, contact your local emergency services.' },

    ayah: { arabic: 'ٱلَّذِينَ ءَامَنُوا۟ وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ ٱللَّهِ ۗ أَلَا بِذِكْرِ ٱللَّهِ تَطْمَئِنُّ ٱلْقُلُوبُ',

function extraBlocks(t, bg, fg) {
  const p = (s) => `<p class="body">${esc(s)}</p>`;
  const box = (label, inner) => `<div class="card ad xtra" style="background:${bg || '#B5C4A9'};color:${fg || '#3D2C31'};border-color:rgba(255,255,255,.6)"><div class="label">${label}</div>${inner}</div>`;
  return `${box('ENCOURAGEMENT', p(t.encouragement) + `<hr><div class="arabic">${esc(t.ayah.arabic)}</div><div class="tr">“${esc(t.ayah.translation)}”</div><div class="src">${esc(t.ayah.source)}</div>`)}
    ${t.dua ? box('DUA', duaBlock(t.dua)) : ''}
    ${box('INTENTION', p(t.intention))}
    ${box('TURN TO ALLAH', p(t.turn))}
    ${box('TIE YOUR CAMEL', p(t.camel) + '<p class="src">Tie your camel, then place your trust in Allah. (Jami’ at-Tirmidhi 2517)</p>')}
    <p class="subtitle tnote">A dua brings relief to the heart. It does not replace taking the means.</p>`;
}
const EXTRAS = { Sad: SAD_EXTRA, Guilt: GUILT_EXTRA };

const duaBlock = (d) => `<div class="tdua"><h4>${esc(d.title)}</h4>
  <div class="arabic">${esc(d.arabic)}</div>
  ${d.transliteration ? `<div class="translit">${esc(d.transliteration).replace(/'/g, '’')}</div>` : ''}
  <div class="tr">“${esc(d.translation)}”</div>
  <div class="src">${esc(d.source).replace(/'/g, '’')}</div></div>`;

function renderTopic(id) {
  const t = TOPICS.find((x) => x.id === id);
  if (!t) return;
  const duas = t.duas.map((d) => (d.ref ? adFind(d.ref) : d)).filter(Boolean);
  const p = (s) => `<p class="body">${esc(s)}</p>`;
  const box = (label, inner) => `<div class="card ad"><div class="label">${label}</div>${inner}</div>`;
  $('feel').innerHTML = `<div class="wrap">
    <button class="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>
    <div class="header"><h1 class="title">${esc(t.title)}</h1><p class="subtitle">${esc(t.blurb)}</p></div>
    ${box('ENCOURAGEMENT', p(t.encouragement) + (t.ayah ? `<hr><div class="arabic">${esc(t.ayah.arabic)}</div><div class="tr">“${esc(t.ayah.translation)}”</div><div class="src">${esc(t.ayah.source)}</div>` : ''))}
    ${box(duas.length > 1 ? 'DUAS' : 'DUA', duas.map(duaBlock).join('<hr>'))}
    ${box('INTENTION', p(t.intention))}
    ${box('TURN TO ALLAH', p(t.turn))}
    ${box('TIE YOUR CAMEL', p(t.camel) + '<p class="src">Tie your camel, then place your trust in Allah. (Jami’ at-Tirmidhi 2517)</p>')}
    <p class="subtitle tnote">A dua brings relief to the heart. It does not replace taking the means.</p>
  </div>`;
  $('feel').querySelector('.back').addEventListener('click', renderFeelList);
  $('feel').scrollTop = 0;
}

function renderFeelList() {
  $('feel').innerHTML = `<div class="wrap">
    <div class="header"><h1 class="title">How is your heart today?</h1>
    <p class="subtitle">Select what your heart is carrying to find comfort in Allah’s words.</p></div>
    <div class="chips">${emotions.map((e, i) =>
      `<button class="chip" data-e="${esc(e.name)}" style="background:${e.color};color:${e.textColor};animation-delay:${i * 0.2}s">${esc(e.name)}</button>`).join('')}
    </div>
    <div class="topics"><h2 class="tt">When it’s about something specific</h2>
    <p class="subtitle">Find a dua, an intention and a step to take.</p>
    ${TOPICS.map((t) => `<button class="topic" data-t="${t.id}"><span><b>${esc(t.title)}</b><small>${esc(t.blurb)}</small></span><span class="chev">›</span></button>`).join('')}
    <p class="subtitle more">More topics coming soon, in sha Allah.</p></div></div>`;
  $('feel').querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => renderVerse(c.dataset.e)));
  $('feel').querySelectorAll('.topic').forEach((b) => b.addEventListener('click', () => renderTopic(b.dataset.t)));
  $('feel').scrollTop = 0;
}

function renderVerse(name) {
  const v = VERSES.find((x) => x.emotion === name);
  if (!v) return;
  const c = v.textColor || '#3D2C31';
  const sec = (label, text, italic) => `<div class="label" style="color:${c}">${label}</div>
    <p class="body" style="color:${c};${italic ? 'font-style:italic' : ''}">“${esc(text)}”</p><hr>`;
  $('feel').innerHTML = `<div class="wrap">
    <button class="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>
    <span class="emo-badge" style="color:${c}">${esc(v.emotion.toUpperCase())}</span>
    <div class="verse" style="background:${v.color || '#B5C4A9'};color:${c}">
      <div class="label">QUR'AN</div>
      <div class="arabic">${esc(v.arabic)}</div>
      ${v.transliteration ? `<div class="translit">${esc(v.transliteration)}</div>` : ''}
      <div class="tr">“${esc(v.translation)}”</div>
      <div class="src">${esc(v.source)}</div><hr>
      ${v.hadith ? sec('HADITH', v.hadith) : ''}
      ${v.dua ? sec("PERSONAL DU'A", v.dua, true) : ''}
      <div class="label">GENTLE TAKEAWAY</div>
      <p class="body">${esc(v.reflection)}</p>
    </div>${EXTRAS[v.emotion] ? extraBlocks(EXTRAS[v.emotion], v.color || '#B5C4A9', v.textColor || '#3D2C31') : ''}</div>`;
  $('feel').querySelector('.back').addEventListener('click', renderFeelList);
  $('feel').scrollTop = 0;
}
renderFeelList();

Object.values(IMG).forEach((src) => { new Image().src = src; }); // preload
const STORE_KEY = 'total_trees_planted';
const MAX_DROPS = 12;
const PRAYER_NAMES = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
const DHIKR = [
  { key: 'laIlahaIllallah', title: 'La ilaha illallah', sub: 'There is no deity worthy of worship except Allah' },
  { key: 'durood', title: 'Durood Shareef', sub: 'Sending blessings upon the Prophet ﷺ (especially on Friday)' },
  { key: 'morningAdhkar', title: 'Morning Adhkar', sub: 'Protective morning supplications' },
  { key: 'eveningAdhkar', title: 'Evening Adhkar', sub: 'Protective evening supplications' },
  { key: 'tasbihFatimah', title: 'Tasbih Fatimah', sub: '33x SubhanAllah, 33x Alhamdulillah, 34x Allahu Akbar' },
  { key: 'istighfar', title: 'Daily Istighfar', sub: 'Seeking forgiveness & peace of heart' },
];

const DAY_KEY = 'faraj_today';
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const state = { totalTrees: 0, date: '', hasBloomedToday: false, prayers: {}, dhikr: {} };

// Start a fresh day: all ticks cleared, but the tree total is untouched
function resetDay() {
  state.date = todayKey();
  state.hasBloomedToday = false;
  state.prayers = Object.fromEntries(PRAYER_NAMES.map((n) => [n, { fard: false, sunnah: false }]));
  state.dhikr = Object.fromEntries(DHIKR.map((d) => [d.key, false]));
}
function saveDay() {
  try {
    localStorage.setItem(DAY_KEY, JSON.stringify({ date: state.date, prayers: state.prayers, dhikr: state.dhikr, bloomed: state.hasBloomedToday }));
  } catch (e) {}
}
// Restore today's ticks if they were saved today; anything saved on an earlier day is ignored
function loadDay() {
  resetDay();
  try {
    const s = JSON.parse(localStorage.getItem(DAY_KEY));
    if (s && s.date === state.date) {
      PRAYER_NAMES.forEach((n) => { if (s.prayers && s.prayers[n]) state.prayers[n] = { fard: !!s.prayers[n].fard, sunnah: !!s.prayers[n].sunnah }; });
      DHIKR.forEach((d) => { if (s.dhikr) state.dhikr[d.key] = !!s.dhikr[d.key]; });
      state.hasBloomedToday = !!s.bloomed;
    }
  } catch (e) {}
}
try { const s = localStorage.getItem(STORE_KEY); if (s !== null) state.totalTrees = parseInt(s, 10) || 0; } catch (e) {}
loadDay();

const drops = () =>
  Object.values(state.prayers).reduce((n, p) => n + p.fard + p.sunnah, 0) + Object.values(state.dhikr).filter(Boolean).length;

function stageFor(d) {
  if (d < 4) return { image: IMG.seed, level: 'Seedling', text: 'A tiny seed resting in fertile soil, planted with Bismillah' };
  if (d < 8) return { image: IMG.sprout, level: 'Sprouting', text: 'First gentle green shoots reaching upward with your remembrance' };
  if (d < 12) return { image: IMG.potted, level: 'Growing', text: 'A young sapling growing strong branches through your daily prayers' };
  return { image: IMG.bloom, level: 'Bloomed', text: 'In Full Bloom • May it cast deep shade for your Akhirah' };
}

function buildGarden() {
  $('garden').innerHTML = `<div class="wrap">
    <div class="header"><h1 class="title">Your Garden</h1>
      <p class="subtitle">More than a tracker, a quiet space to nurture your daily habits and plant shade for your Akhirah.</p></div>
    <div class="card trees"><div class="ico"><img src="${IMG.bloom}" alt=""></div>
      <div class="t"><div class="n" id="treeCount"></div><div class="l">Planted in your eternal garden so far</div></div></div>
    <div class="cult"><h3><svg viewBox="0 0 24 24"><path d="M12 22V11M12 11c0-4 2-7 6-8 0 4-2 7-6 8zM12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>Cultivating Your Garden</h3>
      <p>This is more than a daily habit tracker, it is a quiet space to cultivate your soul. With every prayer logged and every dhikr recited, you nurture the seed on your screen. Let each drop of water remind you of what is blooming in Jannah with every remembrance of Allah.</p></div>
    <div class="card plant"><div class="stage" id="stageLevel"></div>
      <img id="stageImg" alt="Your plant"><div class="st" id="stageText"></div>
      <div class="bar"><div class="fill" id="fill"></div></div><div class="prog" id="prog"></div></div>
    <div class="section"><h2>Daily Salah</h2><div class="s">Tick Fard and Sunnah as you complete them</div>
      ${PRAYER_NAMES.map((n) => `<div class="row"><span class="nm">${n}</span><div class="group">
        <button class="pill" data-p="${n}" data-t="sunnah"></button><button class="pill" data-p="${n}" data-t="fard"></button></div></div>`).join('')}</div>
    <div class="section"><h2>Daily Dhikr</h2><div class="s">Water your tree with remembrance</div>
      ${DHIKR.map((d) => `<button class="dh" data-d="${d.key}"><span class="tx"><b>${d.title}</b><small>${d.sub}</small></span><span class="ico"></span></button>`).join('')}</div>
    <footer class="brand">Build &amp; Bloom by Fay’s Journey</footer>
  </div>`;
  $('garden').querySelectorAll('.pill').forEach((b) => b.addEventListener('click', () => {
    const p = state.prayers[b.dataset.p]; p[b.dataset.t] = !p[b.dataset.t]; updateGarden();
  }));
  $('garden').querySelectorAll('.dh').forEach((b) => b.addEventListener('click', () => {
    state.dhikr[b.dataset.d] = !state.dhikr[b.dataset.d]; updateGarden();
  }));
  updateGarden();
}

function updateGarden() {
  const d = drops();
  if (d >= MAX_DROPS && !state.hasBloomedToday) {
    state.hasBloomedToday = true;
    state.totalTrees += 1;
    try { localStorage.setItem(STORE_KEY, String(state.totalTrees)); } catch (e) {}
  }
  saveDay();
  const s = stageFor(d);
  $('treeCount').textContent = `${state.totalTrees} ${state.totalTrees === 1 ? 'Tree' : 'Trees'}`;
  $('stageLevel').textContent = s.level.toUpperCase();
  if ($('stageImg').getAttribute('src') !== s.image) $('stageImg').src = s.image;
  $('stageText').textContent = s.text;
  $('fill').style.width = Math.min((d / MAX_DROPS) * 100, 100) + '%';
  $('prog').textContent = `${d} of ${MAX_DROPS} drops earned today`;
  $('garden').querySelectorAll('.pill').forEach((b) => {
    const on = state.prayers[b.dataset.p][b.dataset.t];
    b.classList.toggle('on', on);
    b.innerHTML = `${checkIcon(on)}<span>${b.dataset.t === 'fard' ? 'Fard' : 'Sunnah'}</span>`;
  });
  $('garden').querySelectorAll('.dh').forEach((b) => {
    const on = state.dhikr[b.dataset.d];
    b.classList.toggle('on', on);
    b.querySelector('.ico').innerHTML = checkIcon(on);
  });
}
buildGarden();

// If the app is open when midnight passes (or is reopened the next day), start a fresh day
function checkNewDay() {
  if (todayKey() !== state.date) { resetDay(); updateGarden(); }
  checkAdhkarDay();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
setInterval(checkNewDay, 60000);

    "Aṣbaḥnā wa aṣbaḥa-l-mulku li-llāh, wa-l-ḥamdu li-llāh, lā ilāha illa-llāhu waḥdahū lā sharīka lah, lahu-l-mulku wa lahu-l-ḥamd, wa huwa 'alā kulli shay'in Qadīr, Rabbi as'aluka khayra mā fī hādha-l-yawmi wa khayra mā ba'dah, wa a'ūdhu bika min sharri mā fī hādha-l-yawmi wa sharri mā ba'dah. Rabbi a'ūdhu bika mina-l-kasali wa sū'i-l-kibar, Rabbi a'ūdhu bika min 'adhābin fi-n-nāri wa 'adhābin fi-l-qabr.",
    'We have entered the morning, and the entire kingdom belongs to Allah, and all praise is for Allah. There is no deity except Allah alone, without partner. To Him belongs sovereignty and to Him belongs praise, and He is over all things Omnipotent. My Lord, I ask You for the good of this day and the good of what follows it, and I seek refuge in You from the evil of this day and the evil of what follows it. My Lord, I seek refuge in You from laziness and the hardship of old age. My Lord, I seek refuge in You from punishment in the Fire and punishment in the grave.',
    'Sahih Muslim (2723)',
    'Establishes morning dominion for Allah while seeking comprehensive success and protection from lethargy and punishment.'),
  card('m-victory', 'Supplication for Victory, Light, and Blessings', 1,
    'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلّٰهِ رَبِّ الْعَالَمِيْنَ ، اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ خَيْرَ هٰذَا الْيَوْمِ ، فَتْحَهُ وَنَصْرَهُ وَنُوْرَهُ وَبَرَكَتَهُ وَهُدَاهُ ، وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِيْهِ وَشَرِّ مَا بَعْدَهُ.',
    "Aṣbaḥnā wa aṣbaḥa-l-mulku li-llāhi Rabbi-l-'ālamīn, Allāhumma innī as'aluka khayra hādha-l-yawm, fatḥahū wa naṣrahū wa nūrahū wa barakatahū wa hudāh, wa a'ūdhu bika min sharri mā fīhi wa sharri mā ba'dah.",
    'We have entered the morning, and the entire kingdom belongs to Allah, Lord of the worlds. O Allah, I ask You for the good of this day: its opening, its victory, its light, its blessings, and its guidance; and I seek refuge in You from the evil within it and the evil of what follows it.',
    'Sunan Abu Dawud (5084); graded Hasan by Ibn Hajar',
    'Asks Allah to unlock opportunities (fat-h), grant strength over challenges (nasr), and illuminate choices (nūr and hudā).'),
  card('m-witness', 'Call of All Creation to Bear Witness to Tawhid', 4,
    'اَللّٰهُمَّ إِنِّيْ أَصْبَحْتُ أُشْهِدُكَ ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلَائِكَتَكَ وَجَمِيْعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللّٰهُ لَا إِلٰهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيْكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُوْلُكَ.',
    "Allāhumma innī aṣbaḥtu ush-hiduk, wa ush-hidu ḥamlata 'arshik, wa malā'ikatika wa jamī'a khalqik, an-naka Anta-llāhu lā ilāha illā Anta waḥdak, lā sharīka lak, wa anna Muḥammadan 'abduka wa rasūluk.",
    'O Allah, I have entered the morning and I call You, the bearers of Your Throne, Your angels, and all Your creation to bear witness that You are Allah; there is no deity except You alone, without partner, and that Muhammad is Your servant and Messenger.',
    'Sunan Abu Dawud (5069). (Scholars differ on its grading, but reciting it four times carries the traditional virtue of freedom from the Fire.)',
    'Saying this four times in the morning is reported to completely free the reciter from the punishment of Hellfire.'),
  card('m-life', 'Morning Affirmation of Life and Resurrection', 1,
    'اَللّٰهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوْتُ وَإِلَيْكَ النُّشُوْرُ.',
    "Allāhumma bika aṣbaḥnā wa bika amsaynā wa bika naḥyā wa bika namūtu wa ilayka-n-nushūr.",
    'O Allah, by You we have entered the morning and by You we enter the evening, by You we live and by You we die, and to You is the resurrection.',
    "Jami' at-Tirmidhi (3391), Sunan Abu Dawud (5068); rated Sahih by Al-Albani",
    "Connects the routine of waking up each morning to Allah's sovereignty over life, death, and final resurrection (nushūr)."),
  card('m-health', 'Supplication for Physical Health and Defense Against Poverty', 3,
    'اَللّٰهُمَّ عَافِنِيْ فِيْ بَدَنِيْ ، اَللّٰهُمَّ عَافِنِيْ فِيْ سَمْعِيْ ، اَللّٰهُمَّ عَافِنِيْ فِيْ بَصَرِيْ ، لَا إِلٰهَ إِلَّا أَنْتَ ، اَللّٰهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ ، وَأَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ ، لَا إِلٰهَ إِلَّا أَنْتَ.',
    "Allāhumma 'āfinī fī badanī, Allāhumma 'āfinī fī sam'ī, Allāhumma 'āfinī fī baṣarī, lā ilāha illā Ant, Allāhumma innī a'ūdhu bika mina-l-kufri wa-l-faqr, wa a'ūdhu bika min 'adhābi-l-qabr, lā ilāha illā Ant.",
    'O Allah, grant me well-being in my body. O Allah, grant me well-being in my hearing. O Allah, grant me well-being in my sight. There is no deity except You. O Allah, I seek refuge in You from disbelief and poverty, and I seek refuge in You from the punishment of the grave. There is no deity except You.',
    'Sunan Abu Dawud (5090), Musnad Ahmad (20430); rated Hasan by Al-Albani',
    'Protects vital physical senses (hearing and sight) while seeking safety from spiritual decay, economic distress, and punishment in the grave.'),
  card('m-hasbi', 'The Affirmation of Sufficiency (Hasbiyallah)', 7,
    'حَسْبِيَ اللّٰهُ لَا إِلٰهَ إِلَّا هُوَ ، عَلَيْهِ تَوَكَّلْتُ ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيْمِ.',
    "Ḥasbiya-Allāhu lā ilāha illā Huwa, 'alayhi tawakkaltu, wa Huwa Rabbu-l-'Arshi-l-'aẓīm.",
    'Allah is sufficient for me; there is no deity except Him. Upon Him I have relied, and He is the Lord of the Great Throne.',
    'Sunan Abu Dawud (5081). Reported authentically as a Mawquf statement of the noble companion Abu al-Darda (RA).',
    'Reciting this seven times in the morning safeguards the reciter against whatever worldly or spiritual anxieties distress them throughout the day.'),
  card('m-radhitu', 'Expression of Contentment with Faith', 3,
    'رَضِيْتُ بِاللّٰهِ رَبًّا ، وَبِالْإِسْلَامِ دِيْنًا ، وَبِمُحَمَّدٍ نَّبِيًّا.',
    "Raḍītu bi-llāhi Rabbā, wa bi-l-islāmi dīnā, wa bi Muḥammadin-Nabiyyā.",
    'I am pleased with Allah as my Lord, with Islam as my religion, and with Muhammad ﷺ as my Prophet.',
    'Sunan Abu Dawud (5072), Musnad Ahmad (18967); rated Sahih by Al-Albani',
    'The Prophet ﷺ guaranteed that whoever says this three times in the morning, Allah takes it upon Himself to satisfy and please them on the Day of Judgment.'),
  card('m-shield', 'The Shield Against Unexpected Harm', 3,
    'بِسْمِ اللّٰهِ الَّذِيْ لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ ، وَهُوَ السَّمِيْعُ الْعَلِيْمُ.',
    "Bismi-llāhi-lladhī lā yaḍurru ma'asmihi shay'un fi-l-arḍi wa lā fi-s-samā', wa Huwa-s-Samī'u-l-'Alīm.",
    'In the name of Allah, with whose name nothing on earth or in the heavens can cause harm, and He is the All-Hearing, the All-Knowing.',
    "Sunan Abu Dawud (5088), Jami' at-Tirmidhi (3388); rated Sahih by Al-Albani",
    'Protects against sudden calamities. Anyone who recites this three times in the morning will remain safe from unexpected harm until evening.'),
  card('m-subhan100', 'Subhanallahi wa Bihamdihi (100x Remembrance)', 100,
    'سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ.',
    "Subḥāna-llāhi wa bi ḥamdih.",
    'Glorified is Allah and praised is He.',
    'Sahih Muslim (2692), Sahih al-Bukhari (6405)',
    'Erases sins even if they are like the foam of the sea, and ensures no one brings a superior deed on Judgment Day except one who said the same or more.'),
  card('m-tahleel', 'Declarative Tahleel (100x Monotheism)', 100,
    'لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيْرٌ.',
    "Lā ilāha illā-Allāh, waḥdahū lā sharīka lah, lahu-l-mulk, wa lahu-l-ḥamd, wa Huwa 'alā kulli shay'in Qadīr.",
    'There is no deity except Allah alone, without partner. To Him belongs sovereignty and to Him belongs praise, and He is over all things Omnipotent.',
    'Sahih al-Bukhari (3293), Sahih Muslim (2691)',
    'Equal to freeing ten slaves, grants 100 good deeds, wipes away 100 sins, and acts as a fortress against Satan for the entire day.'),
  card('m-general', 'General Glorification (Tasbeeh, Tahmeed, Takbeer)', 100,
    'سُبْحَانَ اللّٰهِ ، اَلْحَمْدُ لِلّٰهِ ، اَللّٰهُ أَكْبَرُ.',
    "Subḥāna-llāh, Alḥamdu li-llāh, Allāhu akbar.",
    'Glory be to Allah, all praise is due to Allah, Allah is the Greatest.',
    'Sahih Muslim (2698)',
    'Among the most beloved words to Allah, constantly refreshing the heart with remembrance and high spiritual reward.'),
  card('m-salawat', 'Salawat upon the Prophet ﷺ (Durood Ibrahim)', 10,
    'اَللّٰهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ وَّعَلَىٰ اٰلِ مُحَمَّدٍ ، كَمَا صَلَّيْتَ عَلَىٰ إِبْرَاهِيْمَ وَعَلَىٰ اٰلِ إِبْرَاهِيْمَ ، إِنَّكَ حَمِيْدٌ مَّجِيْدٌ ، اَللّٰهُمَّ بَارِكْ عَلَىٰ مُحَمَّدٍ وَّعَلَىٰ اٰلِ مُحَمَّدٍ ، كَمَا بَارَكْتَ عَلَىٰ إِبْرَاهِيْمَ وَعَلَىٰ اٰلِ إِبْرَاهِيْمَ ، إِنَّكَ حَمِيْدٌ مَّجِيْدٌ.',
    "Allāhumma ṣalli 'alā Muḥammad wa 'alā āli Muḥammad, kamā ṣallayta 'alā Ibrāhīma wa 'alā āli Ibrāhīm, innaka Ḥamīdu-m-Majīd, Allāhumma bārik 'alā Muḥammad, wa 'alā āli Muḥammad, kamā bārakta 'alā Ibrāhīma wa 'alā āli Ibrāhīm, innaka Ḥamīdu-m-Majīd.",
    'O Allah, send blessings upon Muhammad and upon the family of Muhammad, as You sent blessings upon Abraham and upon the family of Abraham; indeed, You are Praiseworthy and Glorious. O Allah, send grace upon Muhammad and upon the family of Muhammad, as You sent grace upon Abraham and upon the family of Abraham; indeed, You are Praiseworthy and Glorious.',
    'Sahih al-Bukhari (3370), Sahih Muslim (406), Al-Targhib wat-Tarheeb (1/273)',
    'Sending blessings ten times brings ten blessings from Allah in return, relieves worries, and earns the intercession of the Prophet ﷺ.'),
  card('m-istighfar', 'Daily Istighfar (Seeking Forgiveness 100x)', 100,
    'أَسْتَغْفِرُ اللّٰهَ وَأَتُوْبُ إِلَيْهِ.',
    "Astaghfiru-llāha wa atūbu ilayh.",
    "I seek Allah's forgiveness and turn to Him in repentance.",
    'Sahih al-Bukhari (6307), Sahih Muslim (2702)',
    'Emulates the Sunnah of the Prophet ﷺ, who sought forgiveness and repented to Allah 70 to 100 times daily.'),
  card('m-adada', "Heavy Remembrance (Subhanallahi wa Bihamdihi 'Adada Khalqihi)", 3,
    'سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ ، عَدَدَ خَلْقِهِ ، وَرِضَا نَفْسِهِ ، وَزِنَةَ عَرْشِهِ ، وَمِدَادَ كَلِمَاتِهِ.',
    "Subḥāna-llāhi wa bi ḥamdih, 'adada khalqih, wa riḍā nafsih, wa zinata 'arshih, wa midāda kalimātih.",
    'Glorified is Allah and praised is He, by the number of His creation, by His pleasure, by the weight of His Throne, and by the ink of His words.',
    'Sahih Muslim (2726)',
    'Exponential reward in minimal time. Taught to Juwayriyah (RA) as a supplication whose immense weight outweighs hours of continuous dhikr.'),
  card('m-knowledge', 'Supplication for Beneficial Knowledge, Pure Provision, and Accepted Deeds', 1,
    'اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ عِلْمًا نَافِعًا ، وَرِزْقًا طَيِّبًا ، وَعَمَلًا مُتَقَبَّلًا.',
    "Allāhumma innī as'aluka 'ilman nāfi'an, wa rizqan ṭayyiban, wa 'amalan mutaqabbalan.",
    'O Allah, I ask You for beneficial knowledge, wholesome provision, and accepted deeds.',
    'Sunan Ibn Majah (925); authenticated by Al-Albani',
    'Recited right after completing the Fajr prayer to ask Allah for the core elements of a productive, blessed day.'),
] },
  evening: { label: 'Evening', hint: 'Traditionally recited after Asr.', cards: [sample('e-sample-1', 1), sample('e-sample-2', 3)] },
  bed: { label: 'Before Bed', hint: 'For as you settle into bed. Separate from the evening adhkar.', cards: [sample('b-sample-1', 1), sample('b-sample-2', 3)] },
};
/* Evening cards: most are the same dhikr as Morning, so they reuse the Morning text and only change what differs */
const MC = (id) => ADHKAR.morning.cards.find((c) => c.id === id);
const ev = (mid, virtue, o = {}) => ({ ...MC(mid), id: 'e-' + mid.slice(2), virtue, ...o });
ADHKAR.evening.cards = [
  ev('m-kursi', 'Reciting this verse in the evening establishes a divine shield that protects the believer from jinn and unseen harm until the morning.'),
  ev('m-quls', 'Reciting these three chapters three times in the evening provides complete protection against all harm through the night until morning. (Recite all three, three times.)'),
  ev('m-sayyid', 'Guaranteed Paradise. Whoever recites it at night with firm faith and passes away before morning will be among the people of Paradise.'),
  ev('m-anxiety', MC('m-anxiety').virtue, { source: 'Sahih al-Bukhari (2893, 6369)' }),
  ev('m-wellbeing', 'Grants complete physical, spiritual, and situational protection through the night.'),
  ev('m-fatir', 'Protects the heart from harmful desires and evil influences during the night.'),
  ev('m-hayy', 'Expresses complete reliance on Allah (Tawakkul) to manage every affair as the day turns into night.'),
  card('e-thanks', 'Dua of Daily Gratitude for Evening Favours', 1,
    'اَللّٰهُمَّ مَا أَمْسَى بِيْ مِنْ نِّعْمَةٍ أَوْ بِأَحَدٍ مِّنْ خَلْقِكَ ، فَمِنْكَ وَحْدَكَ لَا شَرِيْكَ لَكَ ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.',
    "Allāhumma mā amsā bī min ni'matin aw bi-aḥadim-min khalqik, fa-minka waḥdaka lā sharīka lak, fa laka-l-ḥamdu wa laka-sh-shukr.",
    'O Allah, whatever favour has come to me or to any of Your creation this evening is from You alone, without partner. To You belongs all praise and to You belongs all thanks.',
    'Sunan Abu Dawud (5073), Sahih Ibn Hibban (861); graded Hasan by Ibn Hajar',
    'Fulfills the duty of gratitude owed to Allah for all blessings received during the day.'),
  card('e-fitrah', 'Affirmation of Faith upon the Fitrah', 1,
    'أَمْسَيْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ ، وَعَلَىٰ دِيْنِ نَبِيِّنَا مُحَمَّدٍ ، وَعَلَىٰ مِلَّةِ أَبِيْنَا إِبْرَاهِيْمَ حَنِيْفًا مُّسْلِمًا وَّمَا كَانَ مِنَ الْمُشْرِكِيْنَ.',
    "Amsaynā 'alā fiṭrati-l-islām, wa 'alā kalimati-l-ikhlāṣ, wa 'alā dīni Nabiyyinā Muḥammadin ṣallallāhu 'alayhi wa sallam, wa 'alā millati abīnā Ibrāhīma ḥanīfam-muslima, wa mā kāna min-l-mushrikīn.",
    'We have entered the evening upon the natural disposition of Islam, upon the word of pure faith, upon the religion of our Prophet Muhammad ﷺ, and upon the way of our father Abraham, inclined toward truth, a Muslim, and he was not of those who associate partners with Allah.',
    "Musnad Ahmad (15360), Sunan al-Darimi (2689); authenticated by Al-Albani in Sahih al-Jami' (4674)",
    'Re-anchors the soul upon pure monotheism as the day ends.'),
  card('e-praise', 'Evening Declaration of Praise and Testimony', 3,
    'أَمْسَيْتُ أُثْنِيْ عَلَيْكَ حَمْدًا ، وَأَشْهَدُ أَنْ لَّا إِلٰهَ إِلَّا اللّٰهُ.',
    "Amsaytu uthnī 'alayka ḥamdā, wa ash-hadu al-lā ilāha illā-Allāh.",
    'I have entered the evening praising You, and I bear witness that there is no deity except Allah.',
    "Sunan an-Nasa'i in Amal al-Yawm wal-Laylah (571); graded Sahih by Al-Albani",
    'Reaffirms Tawhid and gratitude at dusk.'),
  card('e-goodnight', 'Asking for the Good of the Night and Protection from Its Evil', 1,
    'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلّٰهِ وَالْحَمْدُ لِلّٰهِ ، لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيْرٌ ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِيْ هٰذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا ، وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِيْ هٰذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا ، رَبِّ أَعُوْذُ بِكَ مِنَ الْكَسَلِ وَسُوْءِ الْكِبَرِ ، رَبِّ أَعُوْذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.',
    "Amsaynā wa amsa-l-mulku li-llāh, wa-l-ḥamdu li-llāh, lā ilāha illa-llāhu waḥdahū lā sharīka lah, lahu-l-mulku wa lahu-l-ḥamd, wa huwa 'alā kulli shay'in Qadīr, Rabbi as'aluka khayra mā fī hādhihi-l-laylati wa khayra mā ba'dahā, wa a'ūdhu bika min sharri mā fī hādhihi-l-laylati wa sharri mā ba'dahā. Rabbi a'ūdhu bika mina-l-kasali wa sū'i-l-kibar, Rabbi a'ūdhu bika min 'adhābin fi-n-nāri wa 'adhābin fi-l-qabr.",
    'We have entered the evening, and the entire kingdom belongs to Allah, and all praise is for Allah. There is no deity except Allah alone, without partner. To Him belongs sovereignty and to Him belongs praise, and He is over all things Omnipotent. My Lord, I ask You for the good of this night and the good of what follows it, and I seek refuge in You from the evil of this night and the evil of what follows it. My Lord, I seek refuge in You from laziness and the hardship of old age. My Lord, I seek refuge in You from punishment in the Fire and punishment in the grave.',
    'Sahih Muslim (2723)',
    'Asks for safety, spiritual light, and protection throughout the night.'),
  card('e-victory', 'Supplication for Victory, Light, and Blessings of the Night', 1,
    'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلّٰهِ رَبِّ الْعَالَمِيْنَ ، اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ خَيْرَ هٰذِهِ اللَّيْلَةِ ، فَتْحَهَا وَنَصْرَهَا وَنُوْرَهَا وَبَرَكَتَهَا وَهُدَاهَا ، وَأَعُوْذُ بِكَ مِنْ شَرِّ مَا فِيْهَا وَشَرِّ مَا بَعْدَهَا.',
    "Amsaynā wa amsa-l-mulku li-llāhi Rabbi-l-'ālamīn, Allāhumma innī as'aluka khayra hādhihi-l-laylah, fatḥahā wa naṣrahā wa nūrahā wa barakatahā wa hudāhā, wa a'ūdhu bika min sharri mā fīhā wa sharri mā ba'dahā.",
    'We have entered the evening, and the entire kingdom belongs to Allah, Lord of the worlds. O Allah, I ask You for the good of this night: its opening, its victory, its light, its blessings, and its guidance; and I seek refuge in You from the evil within it and the evil of what follows it.',
    'Sunan Abu Dawud (5084); graded Hasan by Ibn Hajar',
    'Invokes divine light and blessings for the night hours.'),
  card('e-witness', 'Call of All Creation to Bear Witness to Tawhid', 4,
    'اَللّٰهُمَّ إِنِّيْ أَمْسَيْتُ أُشْهِدُكَ ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلَائِكَتَكَ وَجَمِيْعَ خَلْقِكَ ، أَنَّكَ أَنْتَ اللّٰهُ لَا إِلٰهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيْكَ لَكَ ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُوْلُكَ.',
    "Allāhumma innī amsaytu ush-hiduk, wa ush-hidu ḥamlata 'arshik, wa malā'ikatika wa jamī'a khalqik, an-naka Anta-llāhu lā ilāha illā Anta waḥdak, lā sharīka lak, wa anna Muḥammadan 'abduka wa rasūluk.",
    'O Allah, I have entered the evening and I call You, the bearers of Your Throne, Your angels, and all Your creation to bear witness that You are Allah; there is no deity except You alone, without partner, and that Muhammad is Your servant and Messenger.',
    'Sunan Abu Dawud (5069)',
    'Saying this four times at night grants protection from the Fire.'),
  card('e-life', 'Evening Affirmation of Life and Final Return', 1,
    'اَللّٰهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوْتُ وَإِلَيْكَ الْمَصِيْرُ.',
    "Allāhumma bika amsaynā wa bika aṣbaḥnā wa bika naḥyā wa bika namūtu wa ilayka-l-maṣīr.",
    'O Allah, by You we enter the evening and by You we enter the morning, by You we live and by You we die, and to You is the final return.',
    "Jami' at-Tirmidhi (3391), Sunan Abu Dawud (5068); rated Sahih by Al-Albani",
    "Acknowledges Allah's complete control over life, death, and our ultimate return (maṣīr)."),
  ev('m-health', 'Shields health and finances while seeking safety from punishment in the grave.'),
  ev('m-hasbi', 'Protects against all worldly and spiritual distress throughout the night.', { source: 'Sunan Abu Dawud (5081)' }),
  ev('m-radhitu', "Earns Allah's pleasure and satisfaction on the Day of Judgment."),
  ev('m-shield', 'Prevents sudden harm or unexpected afflictions until morning.'),
  ev('m-subhan100', 'Cleanses sins and earns vast spiritual rewards.'),
  ev('m-tahleel', 'A powerful protection against evil forces and a source of immense reward.'),
  ev('m-general', 'Keeps the tongue moist with the remembrance of Allah.'),
  ev('m-salawat', 'Brings ten blessings from Allah for each recitation and secures intercession.', { source: 'Sahih al-Bukhari (3370), Sahih Muslim (406)' }),
  ev('m-istighfar', "Cleanses the day's shortcomings through daily repentance."),
  card('e-creatures', 'Seeking Refuge from Poisonous Creatures (Evening Specific)', 3,
    'أَعُوْذُ بِكَلِمَاتِ اللّٰهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.',
    "A'ūdhu bi-kalimāti-llāhi-t-tāmmāti min sharri mā khalaq.",
    'I seek refuge in the perfect words of Allah from the evil of what He has created.',
    "Sahih Muslim (2709), Jami' at-Tirmidhi (3604)",
    'Reciting this three times in the evening protects against bites and stings from venomous creatures or poisonous insects during the night.'),
];
// Before Bed cards. The B3, B4, B11 and B12 comments below mark where the cards still waiting on text will go.
const bd = (mid, virtue, o = {}) => ({ ...MC(mid), id: 'b-' + mid.slice(2), virtue, ...o });
const TASBIH_SRC = 'Sahih al-Bukhari (3113, 5361), Sahih Muslim (2727)';
ADHKAR.bed.cards = [
  { ...card('b-sajdah', 'Recitation of Surah As-Sajdah and Surah Al-Mulk', 1, 'سُورَةُ السَّجْدَةِ وَسُورَةُ الْمُلْكِ', '',
    'Recite Surah As-Sajdah (Chapter 32) and Surah Al-Mulk (Chapter 67) in full.',
    "Jami' at-Tirmidhi (2892); authenticated by Al-Albani",
    "Jabir (RA) reported that the Prophet ﷺ would not sleep until he had recited Surah As-Sajdah and Surah Al-Mulk. (Note: The virtue of Surah Al-Mulk interceding for its reader until forgiven is established in separate verified ahadith like Sunan an-Nasa'i 681.)"), plain: true },
  bd('m-kursi', 'In the famous narration of Abu Hurairah (RA), the Prophet ﷺ confirmed that whoever recites Ayat al-Kursi when lying down to sleep will have a guardian appointed over them by Allah, and no devil will approach them until morning.', { source: 'Sahih al-Bukhari (2311, 5010)' }),
  card('b-baqarah', 'The Last Two Verses of Surah al-Baqarah (Aamanar-Rasool)', 1,
    'اٰمَنَ الرَّسُوْلُ بِمَآ أُنْزِلَ إِلَيْهِ مِنْ رَّبِّهِ وَالْمُؤْمِنُوْنَ ، كُلٌّ اٰمَنَ بِاللّٰهِ وَمَلآئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ ، لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّنْ رُّسُلِهِ ، وَقَالُوْا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيْرُ. لَا يُكَلِّفُ اللّٰهُ نَفْسًا إِلَّا وُسْعَهَا ، لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ، رَبَّنَا لَا تُؤَاخِذْنَآ إِنْ نَّسِينَآ أَوْ أَخْطَأْنَا ، رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِيْنَ مِنْ قَبْلِنَا ، رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ، وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ، أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكٰـفِرِيْنَ.',
    "Āmana-r-Rasūlu bi-mā unzila ilayhi mir-Rabbihī wa-l-mu'minūn, kullun āmana bi-llāhi wa malā'ikatihī wa kutubihī wa rusulih, lā nufarriqu bayna aḥadim-mir-rusulih, wa qālū sami'nā wa aṭa'nā ghufrānaka Rabbanā wa ilayka-l-maṣīr. Lā yukallifu-llāhu nafsan illā wus'ahā, lahā mā kasabat wa 'alayhā mā-ktasabat, Rabbanā lā tu'ākhidhnā in nasīnā aw akhṭanā, Rabbanā wa lā taḥmil 'alaynā iṣran kamā ḥamaltahu 'alā-lladhīna min qablinā, Rabbanā wa lā tuḥammilnā mā lā ṭāqata lanā bih, wa-'fu 'annā wa-ghfir lanā wa-rḥamnā, Anta Mawlānā fa-nṣurnā 'alā-l-qawmi-l-kāfirīn.",
    'The Messenger has believed in what was revealed to him from his Lord, and [so have] the believers. All of them have believed in Allah and His angels and His books and His messengers, [saying], ‘We make no distinction between any of His messengers.’ And they say, ‘We hear and we obey. [We seek] Your forgiveness, our Lord, and to You is the [final] destination.’ Allah does not charge a soul except [with that within] its capacity. It will have [the consequence of] what [good] it has gained, and it will bear [the consequence of] what [evil] it has earned. ‘Our Lord, do not impose blame upon us if we have forgotten or erred. Our Lord, and lay not upon us a burden like that which You laid upon those before us. Our Lord, and burden us not with that which we have no ability to bear. And pardon us; and forgive us; and have mercy upon us. You are our protector, so give us victory over the disbelieving people.’',
    'Sahih al-Bukhari (5009), Sahih Muslim (807)',
    'The Prophet ﷺ stated that whoever recites these two verses at night, they will suffice him. They serve as a night shield, granting deep spiritual protection and sufficiency.'),
  card('b-kafirun', 'Surah al-Kafirun (Disavowal of Polytheism)', 1,
    'بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ.\nقُلْ يَـٰٓأَيُّهَا الْكَافِرُوْنَ ، لَآ أَعْبُدُ مَا تَعْبُدُوْنَ ، وَلَآ أَنْتُمْ عَابِدُوْنَ مَآ أَعْبُدُ ، وَلَآ أَنَا عَابِدٌ مَّا عَبَدْتُّمْ ، وَلَآ أَنْتُم عَابِدُوْنَ مَآ أَعْبُدُ ، لَكُمْ دِيْنُكُمْ وَلِيَ دِيْنِ.',
    "Bismi-llāhi-r-Raḥmāni-r-Raḥīm.\n\nQul yā-ayyuha-l-kāfirūn, lā a'budu mā ta'budūn, wa lā antum 'ābidūna mā a'bud, wa lā anā 'ābidum-mā 'abadtum, wa lā antum 'ābidūna mā a'bud, lakum dīnukum wa liya dīn.",
    'In the name of Allah, the All-Merciful, the Very Merciful.\n\nSay, ‘O disbelievers, I do not worship what you worship, Nor are you worshippers of what I worship. Nor will I be a worshipper of what you worship, Nor will you be worshippers of what I worship. For you is your religion, and for me is my religion.’',
    "Sunan Abu Dawud (5055), Jami' at-Tirmidhi (3403); rated Sahih by Al-Albani",
    'Reciting this chapter before sleep acts as a clear declaration of freedom from shirk (polytheism).'),
  bd('m-quls', 'Aisha (RA) reported that every night when the Prophet ﷺ went to bed, he would cup his hands together, blow into them, recite these three chapters, and then wipe his hands over as much of his body as he could reach, starting with his head, face, and front of his body, repeating this 3 times.', { title: 'The Three Cupped Palms Protection (Al-Ikhlas, Al-Falaq, An-Nas)', source: 'Sahih al-Bukhari (5017, 5018)' }),
  card('b-tasbih1', 'Tasbih of Fatimah (1 of 3): SubhanAllah', 33, 'سُبْحَانَ اللّٰهِ', 'Subḥān-Allāh', 'Glory be to Allah', TASBIH_SRC,
    'Taught by the Prophet ﷺ to his daughter Fatimah (RA) and Ali (RA) when she asked for a servant to help with household labor. The Prophet ﷺ told them this dhikr before sleeping is far better for them than having a servant, granting strength and spiritual energy.'),
  card('b-tasbih2', 'Tasbih of Fatimah (2 of 3): Alhamdulillah', 33, 'اَلْحَمْدُ لِلّٰهِ', 'Alḥamdu-li-llāh', 'All praise is for Allah', TASBIH_SRC, 'Continue the Tasbih of Fatimah (RA) before sleep.'),
  card('b-tasbih3', 'Tasbih of Fatimah (3 of 3): Allahu Akbar', 34, 'اَللّٰهُ أَكْبَرُ', 'Allāhu-Akbar', 'Allah is the Greatest', TASBIH_SRC, 'Complete the Tasbih of Fatimah (RA) before sleep.'),
  card('b-bismika', 'Supplication for Entrusting the Soul (Bismika Rabbi)', 1,
    'بِاسْمِكَ رَبِّيْ وَضَعْتُ جَنْبِيْ ، وَبِكَ أَرْفَعُهُ ، إِنْ أَمْسَكْتَ نَفْسِيْ فَارْحَمْهَا ، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِيْنَ.',
    "Bismika Rabbī waḍa'tu janbī wa bika arfa'uh, in amsakta nafsī fa-rḥamhā, wa in arsaltahā fa-ḥfaẓhā bi-mā taḥfaẓu bihī 'ibādaka-ṣ-ṣāliḥīn.",
    'In Your name, my Lord, I lay down my side, and by You I raise it up. If You withhold my soul, have mercy upon it; and if You release it, protect it as You protect Your righteous servants.',
    'Sahih al-Bukhari (6320), Sahih Muslim (2714)',
    "The Prophet ﷺ instructed that when lying down on one's right side, one should recite this supplication to entrust soul and body into Allah's protection during sleep."),
  card('b-qini', 'Protection from the Day of Resurrection', 3,
    'اَللّٰهُمَّ قِنِيْ عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.',
    "Allāhumma qinī 'adhābaka yawma tab'athu 'ibādak.",
    'O Allah, protect me from Your punishment on the Day You resurrect Your servants.',
    "Sunan Abu Dawud (5045), Jami' at-Tirmidhi (3398); rated Sahih by Al-Albani",
    'Hudhayfah (RA) and Hafsah (RA) reported that when the Prophet ﷺ intended to sleep, he would place his right hand under his cheek and repeat this three times.'),
  card('b-food', 'Gratitude for Food, Drink, and Shelter', 1,
    'اَلْحَمْدُ لِلّٰهِ الَّذِيْ أَطْعَمَنَا وَسَقَانَا ، وَكَفَانَا ، وَآوَانَا ، فَكَمْ مِّمَّنْ لَّا كَافِيَ لَهُ وَلَا مُؤْوِيَ.',
    "Alḥamdu li-llāhi-lladhī aṭ'amanā wa saqānā, wa kafānā wa āwānā, fa-kam mim-man lā kāfiya lahū wa lā mu'wī.",
    'All praise is for Allah who has fed us, given us drink, satisfied our needs, and provided us shelter; for how many are there who have no one to satisfy their needs or give them shelter.',
    'Sahih Muslim (2715)',
    'Recited upon entering bed to reflect on daily basic necessities (food, water, security, home) that many people around the world are deprived of.'),
  bd('m-fatir', 'Recommended in the morning, evening, and right before sleep to guard against evil inclinations and satanic misguidance.', { title: 'Protection from Ego and Satan', source: "Jami' at-Tirmidhi (3392)" }),
  card('b-debt', 'Asking the Lord of Everything for Debt Relief and Wealth', 1,
    'اَللّٰهُمَّ رَبَّ السَّمٰوَاتِ وَرَبَّ الأَرْضِ وَرَبَّ الْعَرْشِ الْعَظِيْمِ ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ ، فَالِقَ الْحَبِّ وَالنَّوَىٰ ، وَمُنْزِلَ التَّوْرَاةِ وَالْإِنْجِيْلِ وَالْفُرْقَانِ ، أَعُوْذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ أَنْتَ آخِذٌ بِنَاصِيَتِهِ ، اَللّٰهُمَّ أَنْتَ الْأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ ، وَأَنْتَ الْآخِرُ فَلَيْسَ بَعْدَكَ شَيْءٌ ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُوْنَكَ شَيْءٌ ، اِقْضِ عَنَّا الدَّيْنَ وَأَغْنِنَا مِنَ الْفَقْرِ.',
    "Allāhumma Rabba-s-samāwāti wa Rabba-l-arḍi wa Rabba-l-'Arshi-l-'aẓīm, Rabbanā wa Rabba kulli shay', Fāliqa-l-ḥabbi wa-n-nawā, wa Munzila-t-Tawrāti wa-l-Injīli wa-l-Furqān, a'ūdhu bika min sharri kulli shay'in Anta ākhidhum bi-nāṣiyatih. Allāhumma Anta-l-Awwalu fa-laysa qablaka shay', wa Anta-l-Ākhiru fa-laysa ba'daka shay', wa Anta-ẓ-Ẓāhiru fa-laysa fawqaka shay', wa Anta-l-Bāṭinu fa-laysa dūnaka shay', iqḍi 'anna-d-dayna wa aghninā mina-l-faqr.",
    'O Allah, Lord of the heavens, Lord of the earth, and Lord of the Magnificent Throne; our Lord and Lord of everything; Splitter of the grain and date seed; Revealer of the Torah, the Gospel, and the Criterion (Quran). I seek refuge in You from the evil of everything whose forelock You hold. O Allah, You are the First and there is nothing before You; You are the Last and there is nothing after You; You are the Manifest and there is nothing above You; You are the Hidden and there is nothing beyond You. Settle our debts and enrich us against poverty.',
    'Sahih Muslim (2713)',
    'Abu Hurairah (RA) reported that the Prophet ﷺ commanded them to recite this when going to sleep while lying on the right side to settle debts and overcome financial hardship.'),
  card('b-face', "Seeking Refuge in Allah's Noble Face", 1,
    'اَللّٰهُمَّ إِنِّيْ أَعُوْذُ بِوَجْهِكَ الْكَرِيْمِ ، وَكَلِمَاتِكَ التَّامَّةِ مِنْ شَرِّ مَا أَنْتَ آخِذٌ بِنَاصِيَتِهِ ، اَللّٰهُمَّ أَنْتَ تَكْشِفُ الْمَغْرَمَ وَالْمَأْثَمَ ، اَللّٰهُمَّ لَا يُهْزَمُ جُنْدُكَ ، وَلَا يُخْلَفُ وَعْدُكَ ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ ، سُبْحَانَكَ وَبِحَمْدِكَ.',

  card('b-life', 'Entrusting Life and Death to Allah', 1,

    "Bismi-llāhi waḍa'tu janbī, Allāhumma-ghfir lī dhambī, wa akhsi' shayṭānī, wa fukka rihānī, wa-j'alnī fi-n-nadiyyi-l-a'lā.",
    'In the name of Allah, I lay down my side. O Allah, forgive my sin, drive away my devil, free my soul from its bondage, and place me in the highest assembly [of angels].',

    'اَلْحَمْدُ لِلّٰهِ الَّذِيْ كَفَانِيْ وَآوَانِيْ ، اَلْحَمْدُ لِلّٰهِ الَّذِيْ أَطْعَمَنِيْ وَسَقَانِيْ ، اَلْحَمْدُ لِلّٰهِ الَّذِيْ مَنَّ عَلَيَّ فَأَفْضَلَ ، اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ بِعِزَّتِكَ أَنْ تُنَجِّيَنِيْ مِنَ النَّارِ.',

    'لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيْرٌ ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ ، سُبْحَانَ اللّٰهِ وَالْحَمْدُ لِلّٰهِ وَلَا إِلٰهَ إِلَّا اللّٰهُ وَاللّٰهُ أَكْبَرُ.',
